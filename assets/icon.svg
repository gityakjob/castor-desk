<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="castorBgGrad" cx="50%" cy="25%" r="85%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#1b2234"/>
      <stop offset="55%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#090c14"/>
    </radialGradient>

    <linearGradient id="castorBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38445e"/>
      <stop offset="50%" stop-color="#1f2738"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>

    <linearGradient id="castorRingGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <radialGradient id="castorPrimaryOrb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </radialGradient>

    <radialGradient id="castorCompanionOrb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>

    <filter id="castorGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#castorBgGrad)" stroke="url(#castorBorderGrad)" stroke-width="4"/>

  <!-- Subtle Ambient Aura -->
  <circle cx="256" cy="256" r="155" fill="#2DD4BF" opacity="0.10" filter="url(#castorGlow)"/>

  <!-- Subtle Elliptical Orbit Accent -->
  <ellipse cx="256" cy="256" rx="164" ry="76" transform="rotate(-24 256 256)" fill="none" stroke="#38BDF8" stroke-width="6" stroke-opacity="0.22"/>

  <!-- Stylized Open Orbital C-Arc -->
  <path d="M 336.1 173.0 A 124 124 0 1 0 336.1 339.0"
        fill="none"
        stroke="url(#castorRingGrad)"
        stroke-width="38"
        stroke-linecap="round"
        filter="url(#castorGlow)"/>

  <!-- Primary Star Node -->
  <circle cx="244" cy="256" r="48" fill="url(#castorPrimaryOrb)"/>

  <!-- Companion Star Node -->
  <circle cx="380" cy="256" r="28" fill="url(#castorCompanionOrb)"/>
</svg>
